<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ゲンバ｜チケット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --brand:#E8452B; --brand-d:#C0361F; --brand-l:#FFF3F0;
  --ink:#14181F; --ink-2:#3A424E; --muted:#6C7683; --faint:#9AA3AF;
  --bg:#F4F6F8; --card:#FFFFFF; --line:#E1E6EB; --line-2:#EFF2F5;
  --ok:#137A4B; --ok-bg:#EEF8F2; --warn:#8A5300; --warn-bg:#FFF8EC;
  --blue:#1B4F9C; --blue-bg:#F1F5FC;
  --wrap:1180px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:14px;line-height:1.75;
  -webkit-font-smoothing:antialiased;}
button{font:inherit;cursor:pointer;}
input,select{font:inherit;}
.mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px;}

/* ---------- header ---------- */
.hd{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.hd .r1{max-width:var(--wrap);margin:0 auto;padding:0 22px;height:60px;
  display:flex;align-items:center;gap:22px;}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0;}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
.brand b{font-size:17px;font-weight:900;letter-spacing:.04em;}
.search{flex:1;max-width:420px;position:relative;}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:19px;
  padding:0 15px 0 38px;background:var(--bg);font-size:13px;}
.search input:focus{outline:none;border-color:var(--brand);background:#fff;}
.search .ic{position:absolute;left:14px;top:9px;color:var(--faint);font-size:14px;}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:19px;
  padding:6px 13px;background:#fff;font-size:12px;font-weight:700;}
.hd .r2{border-top:1px solid var(--line-2);}
.hd .r2 .in{max-width:var(--wrap);margin:0 auto;padding:0 22px;display:flex;gap:2px;}
.hd .r2 button{border:none;background:none;padding:11px 14px;font-size:13px;font-weight:700;
  color:var(--ink-2);border-bottom:2px solid transparent;}
.hd .r2 button:hover{color:var(--brand);}
.hd .r2 button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand);}
@media(max-width:820px){ .search{display:none;} }

/* ---------- layout ---------- */
.main{padding:24px 0 70px;}
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
.crumb a{color:var(--muted);cursor:pointer;}
.crumb a:hover{color:var(--brand);text-decoration:underline;}
h1.pt{font-size:22px;font-weight:900;margin:0 0 6px;letter-spacing:.01em;}
.pdesc{font-size:12.5px;color:var(--muted);margin:0 0 22px;max-width:78ch;}
.sect{font-size:15px;font-weight:900;margin:0 0 3px;}
.sect-d{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
.pad{padding:20px;}
.g{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){ .g3,.g4{grid-template-columns:repeat(2,1fr);} }
@media(max-width:640px){ .g2,.g3,.g4{grid-template-columns:1fr;} }
.side2{display:grid;gap:18px;grid-template-columns:1fr 344px;align-items:start;}
@media(max-width:980px){ .side2{grid-template-columns:1fr;} }
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* ---------- bits ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:5px;
  letter-spacing:.02em;white-space:nowrap;}
.t-pre{background:var(--brand);color:#fff;}
.t-gen{background:var(--blue);color:#fff;}
.t-soon{background:#E7EAEE;color:var(--muted);}
.t-ok{background:var(--ok-bg);color:var(--ok);}
.t-warn{background:var(--warn-bg);color:var(--warn);}
.t-line{background:#fff;border:1px solid var(--line);color:var(--ink-2);}
.t-host{background:#14181F;color:#fff;}
.btn{border:none;border-radius:9px;padding:12px 18px;font-size:13.5px;font-weight:800;
  background:var(--brand);color:#fff;transition:background .14s;}
.btn:hover{background:var(--brand-d);}
.btn:disabled{background:#C6CCD4;cursor:not-allowed;}
.btn.b2{background:var(--blue);} .btn.b2:hover{background:#143D7C;}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn.gh:hover{border-color:var(--ink-2);}
.btn.sm{padding:8px 13px;font-size:12.5px;}
.btn.wide{width:100%;}
.free{color:var(--ok);font-weight:800;}
.box{border-radius:10px;padding:13px 15px;font-size:11.5px;line-height:1.8;}
.box.ok{background:var(--ok-bg);border:1px solid #CDE8DA;}
.box.warn{background:var(--warn-bg);border:1px solid #F2DFBE;}
.box.info{background:var(--blue-bg);border:1px solid #D5E2F3;}
.box.brand{background:var(--brand-l);border:1px solid #F7D2C8;}
.box.gray{background:var(--bg);border:1px solid var(--line);}
table.kv{width:100%;border-collapse:collapse;}
table.kv td{font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line-2);
  vertical-align:top;}
table.kv td:last-child{text-align:right;font-weight:700;}
table.kv tr:last-child td{border-bottom:none;}
.note{font-size:11px;color:var(--muted);line-height:1.8;}
.tiny{font-size:10.5px;color:var(--faint);line-height:1.8;}

/* ---------- event card ---------- */
.ev{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;
  transition:box-shadow .16s,border-color .16s;}
.ev:hover{box-shadow:0 8px 22px rgba(20,24,31,.08);border-color:#CFD6DE;}
.kv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.kv-art{position:relative;aspect-ratio:16/9;display:flex;align-items:center;
  justify-content:center;font-size:40px;}
.kv-art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,transparent 40%,rgba(20,24,31,.42) 100%);}
.at{position:absolute;z-index:2;}
.at.tl{top:9px;left:9px;} .at.tr{top:9px;right:9px;} .at.bl{bottom:9px;left:9px;}
.ev .bd{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column;gap:5px;}
.ev .nm{font-size:13.5px;font-weight:800;line-height:1.5;}
.ev .mt{font-size:11.5px;color:var(--muted);}
.ev .ft{margin-top:auto;padding-top:10px;border-top:1px solid var(--line-2);}

/* ---------- ticket ---------- */
.tkt{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%;
  transition:box-shadow .16s;}
.tkt:hover{box-shadow:0 8px 22px rgba(20,24,31,.08);}
.tkt .stub{width:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;position:relative;}
.tkt .info{flex:1;padding:14px 16px;min-width:0;}
.tkt .perf{border-left:1px dashed var(--line);padding:14px 16px;width:150px;flex-shrink:0;
  display:flex;flex-direction:column;justify-content:center;gap:4px;}
@media(max-width:700px){ .tkt{flex-wrap:wrap;} .tkt .perf{width:100%;border-left:none;
  border-top:1px dashed var(--line);} }

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,24,31,.55);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:48px 18px;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;position:relative;
  box-shadow:0 24px 64px rgba(20,24,31,.3);animation:pop .2s ease both;}
.modal.lg{max-width:760px;}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mtitle{padding:20px 24px 14px;border-bottom:1px solid var(--line-2);}
.mtitle h3{margin:0;font-size:16px;font-weight:900;}
.mtitle p{margin:4px 0 0;font-size:11.5px;color:var(--muted);}
.mbody{padding:20px 24px;}
.mfoot{padding:16px 24px 20px;border-top:1px solid var(--line);display:flex;gap:9px;}
.x{position:absolute;top:14px;right:15px;border:none;background:none;font-size:20px;
  color:var(--faint);line-height:1;padding:2px 6px;border-radius:6px;}
.x:hover{background:var(--line-2);color:var(--ink);}

/* ---------- pay method ---------- */
.pm{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
.pm[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-l);}
.pm .rd{width:16px;height:16px;border-radius:50%;border:2px solid #C6CCD4;flex-shrink:0;
  margin-top:3px;position:relative;}
.pm[aria-pressed="true"] .rd{border-color:var(--brand);}
.pm[aria-pressed="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;
  background:var(--brand);}

/* ---------- toast ---------- */
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;
  flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none;}
.toast{background:#fff;
  border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;
  padding:14px 18px;box-shadow:0 14px 36px rgba(20,24,31,.16);max-width:340px;
  animation:slidein .22s ease both;}
.toast.info{border-left-color:var(--blue);}
.toast.brand{border-left-color:var(--brand);}
.toast.mute{border-left-color:#C6CCD4;}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast b{display:block;font-size:13px;font-weight:800;margin-bottom:2px;}
.toast span{font-size:11.5px;color:var(--muted);line-height:1.7;}
.flash{animation:flash .7s ease;}
@keyframes flash{0%{background:#FFF0EB}100%{background:transparent}}
.pulse{position:relative;}
.pulse::after{content:"";position:absolute;top:-2px;right:-6px;width:6px;height:6px;
  border-radius:9px;background:var(--brand);animation:blip 1.6s ease-in-out infinite;}
@keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}
.fadein{animation:fadein .26s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#CBD3DC;border-radius:10px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect} = React;

/* ============================================================
   ゲンバ（GENBA）— チケット販売サイト プロトタイプ

     枠の中は完全ランダム。回数が多いほど当たりやすくはならない。
     これは、スコア化は必ず攻略されるという先行事例の教訓に基づく。
   ============================================================ */

/* 画像は外部URLを直接読み込む。読み込めない場合は自動でグラデーション表示に戻る。
   差し替えるときは img: の1行だけ書き換えればよい。 */
const HERO_IMG = 'https://images.unsplash.com/photo-1666289186874-0d023fe7d002?fm=jpg&q=70&w=2400&auto=format&fit=crop';

const EVENTS = [
  {id:'mc-hok', img:'https://storage.googleapis.com/studio-design-asset-files/projects/d7WlonRKaV/s-1920x1080_v-frms_webp_5f11087d-72ac-454b-a0d5-8b70aa1cbf35_small.webp', unlock:'オールナイト公演のアフタームービー', act:'musiccircus', genre:'music', host:true, phase:'pre',
   name:'SBI MUSIC CIRCUS HOKKAIDO -AFTER DARK-', sub:'オールナイト音楽フェス',

   desc:'ドームを終夜使い切るオールナイト公演。ジャンルを横断したラインナップで構成します。'},
  {id:'splash', img:'https://storage.googleapis.com/studio-design-asset-files/projects/d7WlonRKaV/s-1920x1080_v-frms_webp_23128354-58ac-43f1-92fb-842cda248261_small.webp', unlock:'当日のドローン映像フル尺', act:'musiccircus', genre:'music', host:true, phase:'gen',
   name:'SPLASH CIRCUS 2026', sub:'プールフェス',
   venue:'大阪府・堺市', date:'2026/08/22（土）', open:'11:00',
   price:6800, art:'💦', preSeats:900, genSeats:2100,
   desc:'水と音楽のフェス。2日間開催から4日間開催へ拡大しました。'},
  {id:'maihanabi', img:'https://travel.kurashi-upgrade.jp/wp-content/uploads/2026/07/SBI-maihanabi-in-sakai-1024x576.png', unlock:'花火プログラムのメイキング', act:'maihanabi', genre:'music', host:true, phase:'gen',
   name:'SBI舞花火 2026', sub:'花火＋音楽',
   venue:'泉南 SENNAN LONG PARK', date:'2026/09/05（土）', open:'16:00',
   price:5500, art:'🎆', preSeats:1500, genSeats:3500,

/* ランク：金額では上がらない。参戦と継続、配信での応援で上がる */
/* ランク：参戦回数のみで決まる。購入金額では上がらない。
   先行抽選の当選確率にも、リセールの還元率にも影響しない。
   特典は「誰かが得ても他の人が損しないもの」に限定している。 */
const RANKS = [
  {id:'r0', name:'—',        min:0, c:'#9AA3AF',
   perk:'—', note:'公演に1回参加するとブロンズになります'},
  {id:'r1', name:'ブロンズ', min:1, c:'#A9773F',
   perk:'参加記念のデザインが変わる', note:'段階に応じて記念の意匠が変化します'},
  {id:'r2', name:'シルバー', min:2, c:'#7C8896',
   perk:'シルバー限定コレクション', note:'譲渡できないデジタルコレクションをお渡しします'},
  {id:'r3', name:'ゴールド', min:3, c:'#B8860B',
   perk:'ゴールド限定コレクション ／ 金融サービスの優遇',
   note:'限定コレクションは譲渡不可。金融の優遇条件は検討中です'},
];
const rankOf = s => RANKS.slice().reverse().find(r=>s>=r.min) || RANKS[0];
const nextRank = s => RANKS.find(r=>s<r.min) || null;

/* 券面の段階（そのアーティストへの参戦回数） */
const STAGES = [{min:0,l:'—',c:'#C9D1DB'},{min:1,l:'初参戦',c:'#A9773F'},
  {min:3,l:'常連',c:'#7C8896'},{min:5,l:'皆勤',c:'#B8860B'}];
const stageOf = n => STAGES.slice().reverse().find(s=>n>=s.min) || STAGES[0];

/* ランク限定グッズ：到達すると自動でお渡しする。譲渡不可。
   売買できないので「持っている＝通った」の証明になる。 */
const RANK_NFT = {
  r2:{name:'シルバー限定コレクション', art:'🥈', c:'#7C8896',
      desc:'2公演に参加された方だけにお渡ししています'},
  r3:{name:'ゴールド限定コレクション', art:'🥇', c:'#B8860B',
      desc:'3公演以上に参加された方だけにお渡ししています'},
};

/* 他のファンが出品しているリセール在庫（初期値） */
const SEED_MARKET = [
  {id:'M1', evId:'splash',   price:6100, route:'gen', mine:false},
  {id:'M2', evId:'verdy-1',  price:4200, route:'gen', mine:false},
  {id:'M3', evId:'mc-hok',   price:9800, route:'pre', mine:false},
  {id:'M4', evId:'maihanabi',price:7100, route:'gen', mine:false},
];

const TWICAS = {handle:'@naoya_v', min:1240, gift:8400, acts:12};

/* 販売グッズNFT：譲渡自由・数量上限なし・特典なし。
   特典を紐づけると「特典を金で買える」構造になるため、意図的に機能を持たせていない。 */
const GOODS = [
  {id:'gd1', act:'musiccircus', name:'MUSIC CIRCUS 2026 キービジュアル', price:1200,
   art:'🎡', supply:'数量無制限', desc:'今年のキービジュアルをデジタルで。'},
  {id:'gd2', act:'maihanabi', name:'SBI舞花火 2026 プログラム', price:900,
   art:'🎆', supply:'数量無制限', desc:'打ち上げ順と楽曲を収めたデジタルプログラム。'},
  {id:'gd3', act:'verdy', name:'東京ヴェルディ 2026 エンブレム', price:800,
   art:'⚽', supply:'数量無制限', desc:'今シーズンのエンブレムコレクション。'},
  {id:'gd4', act:'goat', name:'GOAT.12 対戦カードポスター', price:1500,
   art:'🥊', supply:'500点限定', desc:'メインカードの公式ポスター。'},
];


const yen = n => '¥'+n.toLocaleString('ja-JP');
const num = n => n.toLocaleString('ja-JP');
const daysTo = d => Math.max(0, Math.ceil((d-TODAY)/86400000));

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============================================================ */
function App(){
  const [view,setView]   = useState('home');
  const [evId,setEvId]   = useState(null);
  const [modal,setModal] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [q,setQ]         = useState('');
  const [genre,setGenre] = useState('all');
  const [tab,setTab]     = useState('upcoming');
  const [ctab,setCtab]   = useState('stub');

  const [verified,setVerified] = useState(true);   // 本人確認
  const [balance,setBalance]   = useState(48000);  // チャージ残高（円）
  const [refund,setRefund]     = useState(1240);   // 還元ポイント
  const [twicas,setTwicas]     = useState(false);
  const [cheer,setCheer]       = useState(0);      // 配信での応援歴（ランクにのみ影響）

  const [tickets,setTickets] = useState([]);
  const [entries,setEntries] = useState([]);
  const [memos,setMemos]     = useState([]);   // 参加記念NFT（譲渡不可）
  const [owned,setOwned]     = useState([]);   // 購入したグッズNFT（譲渡可）
  const [rnfts,setRnfts]     = useState([]);   // ランク限定NFT（譲渡不可）
  const [market,setMarket]   = useState(SEED_MARKET);
  const [stock,setStock]     = useState(()=>
    Object.fromEntries(EVENTS.map(e=>[e.id,e.genSeats])));
  const [log,setLog]         = useState([]);

  const say = (t,d,kind) => {
    const id='T'+Date.now()+Math.random();
    setToasts(p=>[...p.slice(-2),{id,t,d,kind}]);
    setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),5200);
  };

  /* 参戦回数（アーティスト単位・入場した回数のみ） */
  const attended = act => tickets.filter(t=>t.act===act && t.used).length;
  const totalAttended = tickets.filter(t=>t.used).length;
  /* ランクは参戦回数のみ。配信の応援歴は上限1段階分だけ加算される */
  const cheerBonus = cheer>=500 ? 1 : 0;
  const rankScore = totalAttended + cheerBonus;
  const rank = rankOf(rankScore), nx = nextRank(rankScore);

  const addLog = (label,detail) =>
    setLog(p=>[{id:'L'+Date.now()+Math.random(),label,detail},...p]);

  /* --- 配信の応援歴を連携（抽選には影響しない） --- */
  const linkTwicas = () => {
    const pts = Math.floor(TWICAS.min*0.1)+Math.floor(TWICAS.gift*0.03)+TWICAS.acts*20;
    setTwicas(true); setCheer(pts); setModal(null);
    addLog('配信の応援歴を連携','ランクの判定に反映されます');
    say('応援歴を連携しました','ランクの判定に反映されます。先行抽選の当選確率は変わりません。');
  };

  /* --- 先行抽選に申し込む --- */
  const apply = (ev) => {
    const n = attended(ev.act);
    setEntries(p=>[...p,{id:'E'+Date.now(),evId:ev.id,slot:n>0?'cont':'first',status:'open'}]);
    setModal(null); setView('mytickets'); setTab('entry');
    say('先行抽選のお申し込みを受け付けました',
      `結果は${ev.result}に「申込・抽選結果」でご確認いただけます。`);
  };

  /* --- 抽選（枠の中は完全ランダム。回数で確率は変わらない） --- */
  const draw = (en) => {
    const ev = EVENTS.find(e=>e.id===en.evId);
    setModal({kind:'drawing',ev});
    setTimeout(()=>{
      const p = en.slot==='cont' ? 0.42 : 0.30;
      if(Math.random()>=p){
        setEntries(pr=>pr.map(x=>x.id===en.id?{...x,status:'lost'}:x));
        setModal({kind:'result',won:false,ev});
        return;
      }
      setEntries(pr=>pr.map(x=>x.id===en.id?{...x,status:'won'}:x));
      setModal({kind:'result',won:true,ev,entryId:en.id,slot:en.slot});
    }, 1900);
  };

  /* --- 購入 --- */
  const buy = ({ev,route,method,useRefund,entryId}) => {
    const gross = ev.price;
    const disc = useRefund ? Math.min(refund,gross) : 0;
    const net = gross-disc;
    if(method==='balance' && net>balance){ say('残高が不足しています','チャージ残高をご確認ください。'); return; }
    if(method==='balance') setBalance(b=>b-net);
    if(disc>0) setRefund(r=>r-disc);

    const seed = Date.now();
    setTickets(p=>[{
      id:'T'+seed, evId:ev.id, act:ev.act, route, used:false, listed:false, listPrice:null,
      no:'GB-'+String(seed).slice(-8), seat:seatOf(ev,seed), method,
    },...p]);
    if(entryId) setEntries(pr=>pr.filter(x=>x.id!==entryId));
    addLog(`${ev.name} を購入`, route==='pre'?'先行抽選':'一般発売');
    setModal(null); setView('mytickets'); setTab('upcoming');
    say('お支払いが完了しました','電子チケットは「マイチケット」に発行されました。');
  };

  /* --- 入場（もぎり） --- */
  const useTicket = (t) => {
    const ev = EVENTS.find(e=>e.id===t.evId);
    setTickets(p=>p.map(x=>x.id===t.id?{...x,used:true}:x));
    setMemos(p=>p.some(m=>m.evId===ev.id) ? p : [{
      id:'M'+Date.now(), evId:ev.id, act:ev.act,
      name:ev.name+' 参加記念', unlock:ev.unlock, art:ev.art, img:ev.img,
    },...p]);
    addLog(`${ev.name} に入場`, `${ACTS[t.act].short} への参戦回数が1回増えました`);
    setModal(null); setView('collection'); setCtab('stub');
    say('入場を確認しました',
      `参戦回数が ${attended(t.act)+1}回 になりました。参加記念を1点お渡ししました。`);
  };

  /* --- グッズNFTを買う --- */
  const buyGoods = (g) => {
    if(g.price>balance){ say('残高が不足しています','チャージ残高をご確認ください。'); return; }
    setBalance(b=>b-g.price);
    setOwned(p=>[{id:'O'+Date.now(), goodsId:g.id},...p]);
    addLog(`${g.name} を購入`, yen(g.price));
    setModal(null); setView('collection'); setCtab('goods');
    say('お買い上げありがとうございます','コレクションに追加されました。');
  };

  /* --- 出品：マーケットに載る。安く出すほど早く売れる --- */
  const listTicket = (t,price) => {
    const ev = EVENTS.find(e=>e.id===t.evId);
    setTickets(p=>p.map(x=>x.id===t.id?{...x,listed:true,listPrice:price}:x));
    const lid='L'+Date.now();
    setMarket(m=>[{id:lid, evId:t.evId, price, route:t.route, mine:true, tid:t.id},...m]);
    addLog(`${ev.name} を出品`, yen(price));
    setModal(null); setTab('listed');

    const ratio = price/ev.price;
    say('出品しました', price<=ev.price
      ? '定価以下のため、優先的にマッチングされます。'
      : `定価の${Math.round(ratio*100)}%です。値下げすると早く売れます。`, 'brand');

    /* 価格が安いほど早く成約する（定価以下＝約6秒、上限150%＝約22秒） */
    const delay = 6000 + Math.max(0,(ratio-1))*32000 + Math.random()*3000;
    setTimeout(()=>{
      setMarket(m=>{
        if(!m.some(x=>x.id===lid)) return m;          // すでに取り下げ済み
        const diff = Math.max(0, price-ev.price);
        const paid = Math.min(price, ev.price);        // 売り手の受取は成約額（上限は定価）
        setBalance(b=>b+paid);
        if(diff>0) setRefund(r=>r+Math.round(diff*SPLIT.fan/100));
        setTickets(p=>p.map(x=>x.id===t.id?{...x,sold:true}:x));
        addLog(`${ev.name} が売れました`, yen(price));
        say('出品したチケットが売れました',
          diff>0
            ? `${yen(paid)} が残高に戻り、差額の${SPLIT.fan}%（${yen(Math.round(diff*SPLIT.fan/100))}）が還元ポイントになりました。`
            : `${yen(paid)} が残高に戻りました。定価以下のため差額はありません。`);
        return m.filter(x=>x.id!==lid);
      });
    }, delay);
  };

  /* --- 出品を取り下げる --- */
  const unlist = (t) => {
    setMarket(m=>m.filter(x=>x.tid!==t.id));
    setTickets(p=>p.map(x=>x.id===t.id?{...x,listed:false,listPrice:null}:x));
    setModal(null); setTab('upcoming');
    say('出品を取り下げました','チケットは「これから」に戻りました。','mute');
  };

  /* --- リセール在庫を買う --- */
  const buyResale = (li) => {
    const ev = EVENTS.find(e=>e.id===li.evId);
    if(li.price>balance){ say('残高が不足しています','チャージ残高をご確認ください。','mute'); return; }
    setBalance(b=>b-li.price);
    setMarket(m=>m.filter(x=>x.id!==li.id));
    const seed=Date.now();
    setTickets(p=>[{
      id:'T'+seed, evId:ev.id, act:ev.act, route:li.route, used:false, listed:false,
      listPrice:null, no:'GB-'+String(seed).slice(-8), seat:seatOf(ev,seed),
      method:'balance', viaResale:true,
    },...p]);
    addLog(`${ev.name} をリセールで購入`, yen(li.price));
    setModal(null); setView('mytickets'); setTab('upcoming');
    say('リセール在庫を購入しました','行けなくなった方から引き継ぎました。');
  };

  /* --- 残席が少しずつ減る（一般発売中の公演） --- */
  useEffect(()=>{
    const t = setInterval(()=>{
      setStock(s=>{
        const gen = EVENTS.filter(e=>e.phase==='gen' && s[e.id]>20);
        if(gen.length===0) return s;
        const e = gen[Math.floor(Math.random()*gen.length)];
        return {...s,[e.id]: s[e.id] - (1+Math.floor(Math.random()*3))};
      });
    }, 3800);
    return ()=>clearInterval(t);
  },[]);

  /* --- 他のファンの出品が入荷する --- */
  useEffect(()=>{
    const t = setInterval(()=>{
      const cand = EVENTS.filter(e=>e.phase!=='soon');
      const e = cand[Math.floor(Math.random()*cand.length)];
      const isPre = Math.random()<0.35;
      const price = isPre ? e.price
        : Math.round(e.price*(0.72+Math.random()*0.62)/100)*100;
      const id='M'+Date.now();
      setMarket(m=>[{id, evId:e.id, price:Math.min(price,Math.floor(e.price*RESALE_CAP)),
        route:isPre?'pre':'gen', mine:false},...m].slice(0,12));
      say('リセール在庫が入荷しました',
        `${e.name}／${yen(price)}　行けなくなった方が手放したチケットです。`,'info');
    }, 15000);
    return ()=>clearInterval(t);
  },[]);

  /* --- ランクに到達すると限定コレクションをお渡しする --- */
  useEffect(()=>{
    const nft = RANK_NFT[rank.id];
    if(!nft) return;
    if(rnfts.some(x=>x.rid===rank.id)) return;
    setRnfts(p=>[{id:'R'+Date.now(), rid:rank.id, ...nft},...p]);
    addLog(`${rank.name}に到達`, nft.name+'をお渡ししました');
    say(`${rank.name}になりました`, `${nft.name}をコレクションに追加しました。`,'brand');
  },[rank.id]);

  const filtered = useMemo(()=>{
    let l = EVENTS;
    if(genre!=='all') l = l.filter(e=>e.genre===genre);
    if(q.trim()){
      const k=q.trim().toLowerCase();
      l = l.filter(e=>(e.name+e.venue+ACTS[e.act].name).toLowerCase().includes(k));
    }
    return l;
  },[genre,q]);

  const ctx = {view,setView,evId,setEvId,modal,setModal,say,q,setQ,genre,setGenre,tab,setTab,
    ctab,setCtab,verified,setVerified,balance,refund,twicas,cheer,tickets,entries,log,
    memos,owned,rnfts,market,stock,attended,totalAttended,rankScore,rank,nx,filtered,
    linkTwicas,apply,draw,buy,useTicket,listTicket,unlist,buyResale,buyGoods};

  return (
    <>
      <Header {...ctx} />
      <div className="main"><div className="wrap">
        {view==='home'       && <Home {...ctx} />}
        {view==='search'     && <Search {...ctx} />}
        {view==='detail'     && <Detail {...ctx} />}
        {view==='goods'      && <GoodsShop {...ctx} />}
        {view==='mytickets'  && <MyTickets {...ctx} />}
        {view==='collection' && <Collection {...ctx} />}
        {view==='account'    && <Account {...ctx} />}
        {view==='rule'       && <Rule {...ctx} />}
      </div></div>
      <Modals {...ctx} />
      <div className="toasts">
        {toasts.map(x=>(
          <div key={x.id} className={'toast '+(x.kind||'')}>
            <b>{x.t}</b><span>{x.d}</span></div>
        ))}
      </div>
      <Foot setView={setView} />
    </>
  );
}

function seatOf(ev,seed){
  const r = mulberry32(seed);
  if(ev.genre==='sports') return `バックB ${Math.floor(r()*30)+1}通路 ${Math.floor(r()*40)+1}列 ${Math.floor(r()*25)+1}番`;
  if(ev.genre==='fight')  return `リングサイド ${'ABCDEF'[Math.floor(r()*6)]}ブロック ${Math.floor(r()*20)+1}番`;
  return `${Math.floor(r()*9)+1}ブロック ${Math.floor(r()*30)+1}列 ${Math.floor(r()*40)+1}番`;
}

        style={{borderRadius:radius||0}} onError={()=>setNg(true)} />}
      {!ok && <span style={{position:'relative',zIndex:1,fontSize:size||40}}>{ev.art}</span>}

}

function EvCard({ev,onOpen,n}){
  const g = gOf(ev.genre);
  const PH={pre:['先行抽選','t-pre'],gen:['一般発売中','t-gen'],soon:['販売前','t-soon']};

function MyTickets({tickets,entries,tab,setTab,setModal,attended,draw,setView}){
  const up = tickets.filter(t=>!t.used && !t.listed);

  const listed = tickets.filter(t=>t.listed);
  const open = entries.filter(e=>e.status==='open');
  const TABS=[['upcoming',`これから（${up.length}）`],['entry',`申込・抽選結果（${open.length}）`],
    ['listed',`出品中（${listed.length}）`]];

  return (
    <>
      <div className="crumb"><a onClick={()=>setView('home')}>ホーム</a> ／ マイチケット</div>

      </p>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:18,
        borderBottom:'1px solid var(--line)',paddingBottom:0}}>
        {TABS.map(([id,l])=>(
          <button key={id} onClick={()=>setTab(id)}
            style={{border:'none',background:'none',padding:'9px 13px',fontSize:12.5,
              fontWeight:700,color:tab===id?'var(--brand)':'var(--ink-2)',
              borderBottom:'2px solid '+(tab===id?'var(--brand)':'transparent'),
              marginBottom:-1}}>{l}</button>
        ))}
      </div>

      {tab==='entry' && (open.length===0
        ? <Empty t="お申し込み中の抽選はありません" d="先行抽選を受付中の公演からお申し込みいただけます。"
            b="公演を探す" onB={()=>setView('search')} />
        : <div style={{display:'grid',gap:12}}>
            {open.map(en=>{
              const ev=EVENTS.find(e=>e.id===en.evId);
              return (
                <div key={en.id} className="card pad">
                  <div className="row" style={{alignItems:'flex-start',flexWrap:'wrap',gap:14}}>
                    <div style={{flex:'1 1 320px'}}>
                      <div style={{display:'flex',gap:8,marginBottom:7}}>
                        <span className="tag t-pre">先行抽選</span>
                        <span className={'tag '+(en.slot==='cont'?'t-ok':'t-line')}>
                          {en.slot==='cont'?'継続枠':'はじめて枠'}</span>
                      </div>
                      <div style={{fontSize:14,fontWeight:800}}>{ev.name}</div>
                      <div className="note">{ev.date} {ev.open}開演／{ev.venue}</div>
                      <div className="note">抽選結果：{ev.result} ／ 1枚</div>
                    </div>
                    <button className="btn" onClick={()=>draw(en)}>抽選結果を確認する</button>
                  </div>
                </div>
              );
            })}
          </div>
      )}

      {tab==='upcoming' && (up.length===0
        ? <Empty t="ご来場予定のチケットはありません" d="先行抽選または一般発売からお求めいただけます。"
            b="公演を探す" onB={()=>setView('search')} />
        : <div style={{display:'grid',gap:12}}>
            {up.map(t=><TktRow key={t.id} t={t} n={attended(t.act)}
              onOpen={()=>setModal({kind:'ticket',t})} />)}
          </div>
      )}

      {tab==='listed' && (listed.length===0
        ? <Empty t="出品中のチケットはありません"
            d="ご来場できなくなった場合、「これから」のチケットから出品できます。" />
        : <div style={{display:'grid',gap:12}}>
            {listed.map(t=><TktRow key={t.id} t={t} n={attended(t.act)} listed
              onOpen={()=>setModal({kind:'ticket',t})} />)}
          </div>
      )}
    </>
  );
}

function Empty({t,d,b,onB}){

    <div className="card pad" style={{textAlign:'center',padding:'52px 22px'}}>

function TktRow({t,n,done,listed,onOpen}){
  const ev = EVENTS.find(e=>e.id===t.evId);
  const g = gOf(ev.genre);
  const st = stageOf(n);
  const isPre = t.route==='pre';
  return (
    <button className="tkt" onClick={onOpen} style={{opacity:listed?.66:1}}>
      <div className="stub" style={{background:g.g,position:'relative',overflow:'hidden'}}>
        {ev.img
          ? <img className="kv-img" src={ev.img} alt="" loading="lazy"
              onError={e=>{e.currentTarget.style.display='none';}} />
          : <span style={{position:'relative',zIndex:1}}>{ev.art}</span>}
      </div>
      <div className="info">
        <div style={{display:'flex',gap:7,marginBottom:6,flexWrap:'wrap'}}>
          <span className={'tag '+(isPre?'t-pre':'t-gen')}>{isPre?'先行抽選':'一般'}</span>
          {done && <span className="tag t-ok">入場済</span>}
          {listed && <span className="tag t-soon">出品中</span>}
          {st.l!=='—' && <span className="tag t-line" style={{color:st.c}}>{st.l}</span>}
        </div>
        <div style={{fontSize:14,fontWeight:800}}>{ev.name}</div>
        <div className="note">{ev.date} {ev.open}開演／{ev.venue}</div>
        <div className="tiny mono" style={{marginTop:4}}>{t.no}　{t.seat}</div>
      </div>
      <div className="perf">
        {listed
          ? <><div className="tiny">出品価格</div>
              <div className="mono" style={{fontSize:15,fontWeight:700}}>{yen(t.listPrice)}</div></>
          : done
            ? <><div className="tiny">{ACTS[t.act].short} への参戦</div>
                <div className="mono" style={{fontSize:15,fontWeight:700}}>{n}回</div></>
            : <><div className="tiny">開演まで</div>
                <div className="mono" style={{fontSize:15,fontWeight:700}}>あと{
                  daysTo(new Date(+ev.date.slice(0,4),+ev.date.slice(5,7)-1,+ev.date.slice(8,10)))
                }日</div>
                <span className="tag t-line" style={{marginTop:4}}>チケットを表示</span></>}
      </div>
    </button>
  );
}

                  `linear-gradient(135deg,${r.c},#14181F)`,fontSize:44}}>
                  <span style={{position:'relative',zIndex:1}}>{r.art}</span>

                  <span className="at tr tag t-line" style={{background:'#fff'}}>譲渡不可</span>

                foot={g.supply} />;
            })}

  );
}

function ColCard({img,art,genre,tag,tagCls,title,sub,foot,lock}){
  const g = gOf(genre);
  return (
    <div className="ev" style={{cursor:'default'}}>
      <div className="kv-art" style={{background:g.g,fontSize:38}}>
        {img
          ? <img className="kv-img" src={img} alt="" loading="lazy"
              onError={e=>{e.currentTarget.style.display='none';}} />
          : <span style={{position:'relative',zIndex:1}}>{art}</span>}
        <span className={'at tl tag '+tagCls}>{tag}</span>
        {lock && <span className="at tr tag t-line" style={{background:'#fff'}}>譲渡不可</span>}
      </div>
      <div className="bd">
        <div className="nm" style={{fontSize:13}}>{title}</div>
        <div className="mt">{sub}</div>
        <div className="ft"><span className="tiny">{foot}</span></div>
      </div>
    </div>
  );
}

function Modals(p){
  const {modal,setModal}=p;
  if(!modal) return null;
  const close=()=>setModal(null);
  const K=modal.kind;
  return (
    <div className="scrim" onClick={e=>{if(e.target===e.currentTarget)close();}}>
      <div className={'modal'+(K==='ticket'?' lg':'')}>
        {K!=='drawing' && <button className="x" onClick={close} aria-label="閉じる">×</button>}
        {K==='twicas' && <MTwicas {...p} close={close} />}
        {K==='apply'  && <MApply  {...p} close={close} />}
        {K==='drawing'&& <MDrawing {...p} />}
        {K==='result' && <MResult {...p} close={close} />}
        {K==='pay'    && <MPay    {...p} close={close} />}
        {K==='ticket' && <MTicket {...p} close={close} />}
        {K==='resale' && <MResale {...p} close={close} />}
        {K==='goods'  && <MGoods  {...p} close={close} />}
        {K==='resalebuy' && <MResaleBuy {...p} close={close} />}
      </div>
    </div>
  );
}

function QR({seed}){
  const N=25;
  const r=mulberry32(seed);
  const cells=[];
  const finder=(x,y)=>(x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(finder(x,y)) continue;
    if(r()>0.5) cells.push([x,y]);
  }
  const F=(ox,oy)=>(
    <g key={ox+'-'+oy}>
      <rect x={ox} y={oy} width={7} height={7} fill="#14181F"/>
      <rect x={ox+1} y={oy+1} width={5} height={5} fill="#fff"/>
      <rect x={ox+2} y={oy+2} width={3} height={3} fill="#14181F"/>
    </g>
  );
  return (
    <svg viewBox={`-2 -2 ${N+4} ${N+4}`} width="176" height="176"
      style={{background:'#fff',borderRadius:8,display:'block'}} role="img" aria-label="入場用コード">
      {cells.map(([x,y])=><rect key={x+'_'+y} x={x} y={y} width={1} height={1} fill="#14181F"/>)}
      {F(0,0)}{F(N-7,0)}{F(0,N-7)}
    </svg>
  );
}
